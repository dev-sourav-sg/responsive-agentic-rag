[project]
name = "responsive-agentic-rag"
version = "0.1.0"
description = "An extensible Agentic RAG platform that ingests knowledge from multiple heterogeneous sources, normalizes and indexes the content, and uses Google ADK-based agents to perform intelligent retrieval and grounded answer generation."
readme = "README.md"
authors = [
    { name = "sourav.sengupta", email = "sourav.sengupta9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-adk>=2.10.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "sqlmodel>=0.0.47",
    "trafilatura>=2.2.0",
]

[project.scripts]
responsive-agentic-rag = "responsive_agentic_rag:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
